<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PesaEarn • Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    body { background:#0b0f17; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1.5rem; }
    .phone-frame { width:100%; max-width:390px; background:#0f141f; border-radius:40px; box-shadow:0 25px 50px -8px rgba(0,0,0,0.8),0 0 0 2px #2a3440; padding:1.5rem 1.4rem 2rem; border:1px solid #2e3a4a; position:relative; overflow:hidden; }
    .phone-frame::before { content:''; position:absolute; top:-80px; left:50%; transform:translateX(-50%); width:280px; height:180px; background:radial-gradient(circle,rgba(59,139,255,0.12) 0%,transparent 70%); border-radius:50%; pointer-events:none; }
    .status-bar { display:flex; justify-content:space-between; align-items:center; color:#a0b0c5; font-size:0.9rem; font-weight:500; margin-bottom:2rem; padding:0 0.2rem; position:relative; z-index:1; }
    .status-bar i { color:#3b8bff; }
    .logo-header { text-align:center; margin-bottom:2.2rem; position:relative; z-index:1; }
    .logo-icon { width:68px; height:68px; background:linear-gradient(145deg,#1e5cff,#1746c4); border-radius:22px; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; box-shadow:0 12px 24px -6px rgba(30,92,255,0.5),inset 0 1px 0 rgba(255,255,255,0.2); }
    .logo-icon i { font-size:2rem; color:#fff; }
    .logo-header h1 { color:#fff; font-size:1.9rem; font-weight:700; letter-spacing:-0.5px; background:linear-gradient(135deg,#fff 0%,#b3cbff 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1.2; }
    .logo-header p { color:#7a8fa6; font-size:0.88rem; margin-top:6px; }
    .login-form { position:relative; z-index:1; }
    .field { margin-bottom:1.1rem; }
    .field label { display:block; color:#8aa0bb; font-size:0.78rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.45rem; padding-left:4px; }
    .input-wrap { position:relative; display:flex; align-items:center; background:#111b29; border:1px solid #293a4e; border-radius:16px; padding:0 1rem; transition:border-color 0.15s,box-shadow 0.15s; }
    .input-wrap:focus-within { border-color:#3b8bff; box-shadow:0 0 0 3px rgba(59,139,255,0.12); }
    .input-wrap i { color:#5f7893; font-size:0.95rem; margin-right:0.7rem; width:18px; text-align:center; transition:color 0.15s; }
    .input-wrap:focus-within i { color:#3b8bff; }
    .input-wrap input { flex:1; background:transparent; border:none; outline:none; color:#eef4ff; font-size:0.95rem; font-weight:500; padding:0.95rem 0; letter-spacing:0.2px; }
    .input-wrap input::placeholder { color:#4d6278; font-weight:400; }
    .toggle-password { background:transparent; border:none; color:#5f7893; font-size:0.9rem; cursor:pointer; padding:6px; margin-right:-4px; transition:color 0.15s; }
    .toggle-password:hover { color:#3b8bff; }
    .form-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.6rem; padding:0 2px; }
    .checkbox-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
    .checkbox-wrap input { display:none; }
    .custom-check { width:18px; height:18px; border:1.5px solid #3d556f; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:all 0.15s; background:#111b29; }
    .checkbox-wrap input:checked + .custom-check { background:#1e5cff; border-color:#1e5cff; }
    .custom-check i { color:#fff; font-size:0.65rem; opacity:0; transition:opacity 0.1s; }
    .checkbox-wrap input:checked + .custom-check i { opacity:1; }
    .checkbox-wrap span { color:#8aa0bb; font-size:0.82rem; font-weight:500; }
    .forgot-link { color:#3b8bff; font-size:0.82rem; text-decoration:none; font-weight:600; transition:color 0.15s; }
    .forgot-link:hover { color:#6ba6ff; }
    .btn-signin { width:100%; border:none; border-radius:18px; padding:1rem; font-weight:700; font-size:1rem; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; background:linear-gradient(145deg,#1e5cff,#1746c4); color:#fff; border:1px solid #3b7bff; box-shadow:0 10px 22px -6px rgba(30,92,255,0.45); transition:all 0.15s; letter-spacing:0.3px; position:relative; z-index:1; }
    .btn-signin:active { transform:scale(0.98); }
    .btn-signin i { font-size:1rem; }
    .divider { display:flex; align-items:center; gap:12px; margin:1.7rem 0 1.4rem; color:#3d556f; font-size:0.75rem; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; position:relative; z-index:1; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#253346; }
    .social-row { display:flex; gap:0.85rem; margin-bottom:1.8rem; position:relative; z-index:1; }
    .social-btn { flex:1; background:#111b29; border:1px solid #293a4e; border-radius:16px; padding:0.85rem; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; color:#d2e0f5; font-weight:600; font-size:0.85rem; transition:all 0.15s; }
    .social-btn i { font-size:1.05rem; }
    .social-btn.google i { color:#ea4335; }
    .social-btn.apple i { color:#fff; }
    .social-btn:hover { background:#162233; border-color:#3f5a7a; }
    .social-btn:active { transform:scale(0.97); }
    .signup-footer { text-align:center; color:#7a8fa6; font-size:0.85rem; position:relative; z-index:1; }
    .signup-footer a { color:#3b8bff; font-weight:700; text-decoration:none; margin-left:4px; }
    .signup-footer a:hover { color:#6ba6ff; }
    .secure-note { margin-top:1.5rem; text-align:center; color:#415a73; font-size:0.7rem; letter-spacing:0.3px; display:flex; align-items:center; justify-content:center; gap:6px; position:relative; z-index:1; }
    .secure-note i { color:#3b8bff; font-size:0.7rem; }
    .error-msg { color:#ff6b6b; font-size:0.78rem; margin-top:0.4rem; padding-left:4px; display:none; font-weight:500; }
    .error-msg.show { display:block; }
  </style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span><i class="fas fa-signal"></i> <i class="fas fa-wifi"></i> <i class="fas fa-battery-full"></i></span></div>
  <div class="logo-header">
    <div class="logo-icon"><i class="fas fa-coins"></i></div>
    <h1>PesaEarn</h1>
    <p>Watch • Earn • Withdraw</p>
  </div>
  <form class="login-form" id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="error-msg" id="emailError">Please enter a valid email address.</div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
      </div>
      <div class="error-msg" id="passwordError">Password must be at least 6 characters.</div>
    </div>
    <div class="form-row">
      <label class="checkbox-wrap">
        <input type="checkbox" id="rememberMe">
        <span class="custom-check"><i class="fas fa-check"></i></span>
        <span>Remember me</span>
      </label>
      <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
    </div>
    <button type="submit" class="btn-signin" id="signInBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
  </form>
  <div class="divider">or continue with</div>
  <div class="social-row">
    <button type="button" class="social-btn google" id="googleBtn"><i class="fab fa-google"></i> Google</button>
    <button type="button" class="social-btn apple" id="appleBtn"><i class="fab fa-apple"></i> Apple</button>
  </div>
  <div class="signup-footer">Don't have an account? <a href="#" id="signupLink">Create one</a></div>
  <div class="secure-note"><i class="fas fa-lock"></i> Secured with 256-bit encryption <i class="fas fa-shield-alt"></i></div>
</div>
<script>
(function(){
  const loginForm=document.getElementById('loginForm');
  const emailInput=document.getElementById('email');
  const passwordInput=document.getElementById('password');
  const emailError=document.getElementById('emailError');
  const passwordError=document.getElementById('passwordError');
  const togglePassword=document.getElementById('togglePassword');
  const signInBtn=document.getElementById('signInBtn');
  const forgotLink=document.getElementById('forgotLink');
  const googleBtn=document.getElementById('googleBtn');
  const appleBtn=document.getElementById('appleBtn');
  const signupLink=document.getElementById('signupLink');

  togglePassword.addEventListener('click',function(){
    const type=passwordInput.getAttribute('type')==='password'?'text':'password';
    passwordInput.setAttribute('type',type);
    this.innerHTML=type==='password'?'<i class="fas fa-eye"></i>':'<i class="fas fa-eye-slash"></i>';
  });
  function validateEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
  function showError(el,show){el.classList.toggle('show',show);}
  emailInput.addEventListener('input',()=>showError(emailError,false));
  passwordInput.addEventListener('input',()=>showError(passwordError,false));

  loginForm.addEventListener('submit',function(e){
    e.preventDefault();
    const email=emailInput.value.trim();
    const password=passwordInput.value;
    let valid=true;
    if(!email||!validateEmail(email)){showError(emailError,true);valid=false;}else{showError(emailError,false);}
    if(!password||password.length<6){showError(passwordError,true);valid=false;}else{showError(passwordError,false);}
    if(!valid)return;

    const originalBtn=signInBtn.innerHTML;
    signInBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Signing in...';
    signInBtn.disabled=true;
    signInBtn.style.opacity='0.8';

    setTimeout(()=>{
      signInBtn.innerHTML='<i class="fas fa-check-circle"></i> Success!';
      signInBtn.style.background='linear-gradient(145deg,#28c76f,#1e9e54)';
      signInBtn.style.borderColor='#28c76f';
      signInBtn.style.boxShadow='0 10px 22px -6px rgba(40,199,111,0.45)';

      setTimeout(()=>{
        signInBtn.innerHTML=originalBtn;
        signInBtn.disabled=false;
        signInBtn.style.opacity='1';
        signInBtn.style.background='linear-gradient(145deg,#1e5cff,#1746c4)';
        signInBtn.style.borderColor='#3b7bff';
        signInBtn.style.boxShadow='0 10px 22px -6px rgba(30,92,255,0.45)';
        // 🔥 REDIRECT TO DASHBOARD
        window.location.href='dashboard.html';
      },900);
    },1200);
  });

  forgotLink.addEventListener('click',function(e){
    e.preventDefault();
    const email=emailInput.value.trim();
    if(email&&validateEmail(email)){
      alert('📧 Password reset link sent to '+email);
    }else{
      emailInput.focus();
      showError(emailError,true);
      emailError.textContent='Enter your email to reset password.';
      setTimeout(()=>{emailError.textContent='Please enter a valid email address.';},2500);
    }
  });

  googleBtn.addEventListener('click',function(){
    this.innerHTML='<i class="fas fa-spinner fa-spin"></i> Connecting...';
    setTimeout(()=>{this.innerHTML='<i class="fab fa-google"></i> Google';alert('🔐 Google sign-in simulated.');},1000);
  });
  appleBtn.addEventListener('click',function(){
    this.innerHTML='<i class="fas fa-spinner fa-spin"></i> Connecting...';
    setTimeout(()=>{this.innerHTML='<i class="fab fa-apple"></i> Apple';alert('🔐 Apple sign-in simulated.');},1000);
  });
  signupLink.addEventListener('click',function(e){e.preventDefault();alert('📝 Sign-up flow would open here.');});
})();
</script>
</body>
      </html>
